name: Precompile binaries

# Builds signed prebuilt sound_cli libraries and uploads them to a
# `precompiled_<crate-hash>` GitHub release, so consumers can build
# sound_flutter without a Rust toolchain. cargokit verifies each download
# against the public_key in packages/sound_flutter/rust/cargokit.yaml.
#
# Requires one repository secret:
#   CARGOKIT_PRIVATE_KEY — the hex private key from `build_tool gen-key`
#   (GITHUB_TOKEN is provided automatically).
#
# Each platform builds on its own runner: ubuntu-latest for Linux and Android,
# macos-latest for macOS and iOS, windows-latest for Windows. build_tool adds
# the Rust targets it needs before each build.

on:
  workflow_dispatch:

# Owner-only manual release preparation. Maintenance never dispatches this.
# Write permission is limited to guarded release/upload jobs.
permissions:
  contents: read

concurrency:
  group: precompile
  cancel-in-progress: false

env:
  REPO: ManyMath/sound
  BUILD_TOOL: packages/sound_flutter/cargokit/build_tool
  CRATE_DIR: packages/sound_flutter/rust

jobs:
  release:
    permissions:
      contents: write
    name: Create release
    # Only the url_prefix repository can publish, so forks skip this job,
    # and with it every job that needs it.
    if: github.event_name == 'workflow_dispatch' && github.server_url == 'https://github.com' && github.repository == 'ManyMath/sound'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - run: dart pub get
        working-directory: ${{ env.BUILD_TOOL }}
      - run: dart pub get --directory tool/signing
      - name: Validate signing key before creating a release
        env:
          PRIVATE_KEY: ${{ secrets.CARGOKIT_PRIVATE_KEY }}
        run: >-
          dart --packages=tool/signing/.dart_tool/package_config.json
          tool/signing/check_signing_key.dart "$CRATE_DIR/cargokit.yaml"
      # cargokit gets or creates the release without retrying, so parallel
      # build jobs would race to create it. Create it once here, named after
      # the crate hash cargokit itself computes.
      - name: Create the precompiled_<hash> release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > "$RUNNER_TEMP/crate_hash.dart" <<'EOF'
          import 'package:build_tool/src/crate_hash.dart';

          void main(List<String> args) => print(CrateHash.compute(args.single));
          EOF
          hash=$(dart --packages="$BUILD_TOOL/.dart_tool/package_config.json" \
            "$RUNNER_TEMP/crate_hash.dart" "$GITHUB_WORKSPACE/$CRATE_DIR")
          if [[ ! $hash =~ ^[0-9a-f]{32}$ ]]; then
            echo "Unexpected crate hash: $hash" >&2
            exit 1
          fi
          tag="precompiled_$hash"
          if gh release view "$tag" --repo "$REPO" > /dev/null 2>&1; then
            echo "$tag already exists"
          else
            # cargokit's own title and body. --latest=false keeps these
            # releases out of the repository's "Latest" slot.
            gh release create "$tag" --repo "$REPO" --target "$GITHUB_SHA" \
              --title "Precompiled binaries ${hash:0:8}" \
              --notes "Precompiled binaries for crate sound_cli, crate hash $hash." \
              --latest=false
          fi


  linux:
    needs: release
    permissions:
      contents: write
    name: Precompile (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: dtolnay/rust-toolchain@stable
      # --glibc-version makes build_tool link with cargo-zigbuild against
      # glibc 2.31, so the .so loads on distros older than ubuntu-latest.
      # cargo-zigbuild needs zig on PATH.
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0
      - run: dart pub get
        working-directory: ${{ env.BUILD_TOOL }}
      - name: Precompile
        env:
          PRIVATE_KEY: ${{ secrets.CARGOKIT_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dart run "$BUILD_TOOL/bin/build_tool.dart" precompile-binaries -v \
            --manifest-dir="$GITHUB_WORKSPACE/packages/sound_flutter/rust" \
            --repository="$REPO" \
            --glibc-version=2.31 \
            --target x86_64-unknown-linux-gnu

  android:
    needs: release
    permissions:
      contents: write
    name: Precompile (Android ABIs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: dtolnay/rust-toolchain@stable
      - run: dart pub get
        working-directory: ${{ env.BUILD_TOOL }}
      # cargokit wants the NDK's full version (r26d here) and looks for it
      # under $ANDROID_SDK_ROOT/ndk/<version>, installing it with sdkmanager
      # if the runner image doesn't already have it.
      - name: Precompile
        env:
          PRIVATE_KEY: ${{ secrets.CARGOKIT_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dart run "$BUILD_TOOL/bin/build_tool.dart" precompile-binaries -v \
            --manifest-dir="$GITHUB_WORKSPACE/packages/sound_flutter/rust" \
            --repository="$REPO" \
            --android-sdk-location="$ANDROID_SDK_ROOT" \
            --android-ndk-version=26.3.11579264 \
            --android-min-sdk-version=26 \
            --target aarch64-linux-android \
            --target armv7-linux-androideabi \
            --target x86_64-linux-android \
            --target i686-linux-android

  macos:
    needs: release
    permissions:
      contents: write
    name: Precompile (macOS and iOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: dtolnay/rust-toolchain@stable
      - run: dart pub get
        working-directory: ${{ env.BUILD_TOOL }}
      - name: Precompile
        env:
          PRIVATE_KEY: ${{ secrets.CARGOKIT_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dart run "$BUILD_TOOL/bin/build_tool.dart" precompile-binaries -v \
            --manifest-dir="$GITHUB_WORKSPACE/packages/sound_flutter/rust" \
            --repository="$REPO" \
            --target x86_64-apple-darwin \
            --target aarch64-apple-darwin \
            --target aarch64-apple-ios \
            --target aarch64-apple-ios-sim \
            --target x86_64-apple-ios

  windows:
    needs: release
    permissions:
      contents: write
    name: Precompile (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: dtolnay/rust-toolchain@stable
      - run: dart pub get
        working-directory: ${{ env.BUILD_TOOL }}
      - name: Precompile
        shell: bash
        env:
          PRIVATE_KEY: ${{ secrets.CARGOKIT_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dart run "$BUILD_TOOL/bin/build_tool.dart" precompile-binaries -v \
            --manifest-dir="$GITHUB_WORKSPACE/packages/sound_flutter/rust" \
            --repository="$REPO" \
            --target x86_64-pc-windows-msvc
