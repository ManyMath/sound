name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (sound_cli)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sound_flutter/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/sound_flutter/rust
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The crate must also compile for Android (AAudio backend). `ring`
      # (rustls's crypto backend, for https:// streaming) builds some
      # primitives from C, so the cross-compile check needs a real Android
      # NDK clang, not just the Rust target added by rustup.
      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27
      - run: rustup target add aarch64-linux-android
      - run: cargo check --target aarch64-linux-android
        env:
          CC_aarch64_linux_android: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          AR_aarch64_linux_android: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
      # ...and for Windows (the waveOut backend). Same `ring` caveat: needs a
      # real mingw-w64 GCC, not just the Rust target.
      - run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - run: rustup target add x86_64-pc-windows-gnu
      - run: cargo check --target x86_64-pc-windows-gnu

  analyze-test:
    name: Analyze & test (Dart/Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # The pub workspace includes Flutter packages, so resolve with Flutter.
      - run: flutter pub get
      - name: Check formatting
        run: dart format --output none --set-exit-if-changed packages/sound_dart packages/sound_flutter/lib packages/sound_flutter/example/lib
      - run: dart analyze packages/sound_dart
      - run: flutter analyze packages/sound_flutter
      # FFI playback tests self-skip when the native lib isn't built (no audio
      # device on CI); the API/registry unit tests always run.
      - run: dart test packages/sound_dart
      # Scope to the plugin's own tests (not the vendored cargokit tests).
      - run: flutter test packages/sound_flutter/test
      # Verify the WebAudio backend compiles to JavaScript.
      - run: dart compile js packages/sound_dart/example/web_main.dart -o /tmp/sound_web.js

  build:
    name: Build example (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [linux, apk]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/sound_flutter/rust
      - name: Install Linux desktop build deps
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config
      - run: flutter pub get
      - name: Build ${{ matrix.target }}
        working-directory: packages/sound_flutter/example
        run: flutter build ${{ matrix.target }} --debug

  # Builds the packages the way a pub.dev consumer gets them (exported without
  # the monorepo, fresh `flutter create` app), which the example build above
  # can't catch.
  consumer:
    name: Consumer build & publish dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/sound_flutter/rust
      - name: Install Linux desktop build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config
      - run: tool/consumer_build.sh linux apk
      # The dry-runs resolve against the workspace, like a real publish.
      - run: flutter pub get
      - name: Publish dry-run (sound_dart)
        working-directory: packages/sound_dart
        run: dart pub publish --dry-run
      - name: Publish dry-run (sound_flutter)
        working-directory: packages/sound_flutter
        run: flutter pub publish --dry-run
