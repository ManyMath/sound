name: sound_dart
description: >-
  Sound for Dart and Flutter with the goal of no additional system dependencies.
  Dart (no Flutter dependency) with native audio from Rust via FFI.
version: 0.0.2
repository: https://github.com/ManyMath/sound
issue_tracker: https://github.com/ManyMath/sound/issues
topics:
  - audio
  - sound
  - playback
  - ffi

environment:
  sdk: ^3.10.0

resolution: workspace

dependencies:
  ffi: ^2.1.0
  http: ^1.2.0
  web: ^1.1.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
