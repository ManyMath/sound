[package]
name = "sound_cli"
version = "0.0.1"
edition = "2021"
description = "Native audio playback for CLI tools."
license = "MIT"
repository = "https://github.com/ManyMath/sound"

[lib]
# cdylib for FFI from Dart; staticlib for static linking (e.g. iOS) later;
# rlib so in-repo examples/tests can call the API directly.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# Pure-Rust multi-format decoding (wav/mp3/ogg-vorbis/flac) for less system deps.
symphonia = { version = "0.5", default-features = false, features = [
    "wav",
    "pcm",
    "mp3",
    "ogg",
    "vorbis",
    "flac",
] }
# TLS for https:// streaming, no system TLS library (Schannel/SecureTransport/
# OpenSSL) at runtime. `ring` is its crypto backend: a Rust crate, but one that
# builds some primitives from C/assembly, so it needs a C toolchain at build
# time (already required by `libloading`'s transitive deps on most hosts) even
# though nothing is dynamically linked against a system TLS lib at runtime.
rustls = { version = "0.23", default-features = false, features = [
    "std",
    "ring",
    "tls12",
] }
# Trust anchors for verifying server certificates, without reading the OS
# trust store (keeps the "no system dependency" property).
webpki-roots = "1.0"

[dev-dependencies]
# Used by tests/examples to synthesize WAV input.
hound = "3.5"
# Pure-Rust FLAC encoder, to round-trip a real compressed format in tests.
flacenc = "0.4"

# Load the system audio library at runtime (libasound.so.2 on Linux,
# libaaudio.so on Android, AudioToolbox.framework on macOS/iOS) so we never
# need its dev headers/pkg-config at build time.
[target.'cfg(any(target_os = "linux", target_os = "android", target_os = "macos", target_os = "ios", target_os = "windows"))'.dependencies]
libloading = "0.8"
